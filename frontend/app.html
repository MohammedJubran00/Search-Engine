<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI Search Engine — search the web and get clear answers."
    />
    <title>AI Search Engine</title>
    <script>
      // Same key as frontend/public/login.js. Chat is not the document at /.
      (function () {
        var token = ''
        try {
          token = localStorage.getItem('ai-search-engine-access-token') || ''
        } catch (error) {
          token = ''
        }
        if (!String(token).trim()) {
          location.replace('/login.html')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
