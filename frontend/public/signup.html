<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create an AI Search Engine account." />
    <title>Sign up — AI Search Engine</title>
    <link rel="stylesheet" href="/signup.css" />
  </head>
  <body>
    <div class="auth">
      <header class="auth__header">
        <a class="auth__brand" href="/">
          <span class="auth__mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <circle cx="9.5" cy="9.5" r="6.25" stroke="currentColor" stroke-width="1.7" />
              <path
                d="M14.2 14.2 19 19"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span class="auth__brand-text">
            <span class="auth__title">AI Search Engine</span>
            <span class="auth__subtitle">Create your account</span>
          </span>
        </a>
      </header>

      <main class="auth__main">
        <section class="auth__card" aria-labelledby="signup-heading">
          <h1 id="signup-heading" class="auth__heading">Sign up</h1>
          <p class="auth__lead">Use a unique email and a strong password. You can search without an account for now.</p>

          <div class="auth__banner auth__banner--error" id="form-error" hidden role="alert"></div>
          <div class="auth__banner auth__banner--success" id="form-success" hidden role="status"></div>

          <form id="signup-form" class="auth__form" novalidate>
            <label class="auth__label" for="full_name">Full name</label>
            <input
              class="auth__input"
              id="full_name"
              name="full_name"
              type="text"
              autocomplete="name"
              maxlength="255"
              required
            />
            <p class="auth__field-error" id="full_name-error" hidden></p>

            <label class="auth__label" for="email">Email</label>
            <input
              class="auth__input"
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              inputmode="email"
              required
            />
            <p class="auth__field-error" id="email-error" hidden></p>

            <label class="auth__label" for="password">Password</label>
            <div class="auth__password">
              <input
                class="auth__input auth__input--password"
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                required
              />
              <button
                class="auth__toggle"
                id="toggle-password"
                type="button"
                aria-pressed="false"
                aria-controls="password"
              >
                Show
              </button>
            </div>
            <p class="auth__hint">
              At least 8 characters, with uppercase, lowercase, a number, and a special character.
            </p>
            <p class="auth__field-error" id="password-error" hidden></p>

            <button class="auth__submit" id="submit-btn" type="submit">
              <span class="auth__submit-label">Create account</span>
              <span class="auth__spinner" id="submit-spinner" hidden aria-hidden="true"></span>
            </button>
          </form>
        </section>
      </main>
    </div>
    <script src="/signup.js" defer></script>
  </body>
</html>
