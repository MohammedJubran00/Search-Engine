[project]
name = "search-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammed Raji Fares Jobran", email = "mohammadjubran2019@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.1,<4.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.4",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn>=0.52.4",
]

[project.scripts]
search-engine = "search_engine:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
