[project]
name = "search-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammed Raji Fares Jobran", email = "mohammadjubran2019@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.4",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
